<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</head>
<body>
    <div class="container-fluid border" style="height: 729px;background-color: #FFCBCB;">
        <div class="col-6 " style="margin-top: 300px; margin-left: 25%;">
            <table class="table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">First value</th>
                    <th scope="col">Second value</th>
                    <th>Max value</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th scope="row">1</th>
                    <td id="a"></td>
                    <td id="b"></td>
                    <td id="max"></td>
                  </tr>
                </tbody>
              </table>
        </div>
    </div>
</body>
<script>
var f=parseInt(prompt("enter the first value"));
document.getElementById("a").innerHTML=f;

var s=parseInt(prompt("enter the second value"));
document.getElementById("b").innerHTML=s;

var d=f>s?f:s;
document.getElementById("max").innerHTML=d;

</script>
</html>
