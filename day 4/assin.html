<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="col-12 border" style="height: 729px;background-color: #E1AFD1;">
    <div class="col-5 m-auto border border-secondary mt-5" style="height: 630px;">
        <h1 class="text-center mt-5">Assignment Oprator</h1>
        <form action="" class="col-8 m-auto mt-5">
            <fieldset>
                <input type="number" placeholder="Enter the first value" id="f" class="form-control mt-4" style="height: 45px;">
                <input type="number" placeholder="Enter the second value" id="s" class="form-control mt-4" style="height: 45px;">
                <!-- <input type="number" placeholder="ans" id="e" class="form-control mt-4"> -->
                <button type="button" onclick="cal()" class="mt-4 btn btn-secondary" style="width: 150px;height: 45px;">Submit</button>
            </fieldset>
        </form>
        <div class="col-8 border m-auto mt-4 rounded"  style="height: 150px;background-color: #AD88C6;">
            <p id="e" class="text-light text-center mt-4"></p>
            <p id="g" class="text-light text-center "></p>
            <p id="h" class="text-light text-center "></p>
        </div>
    </div>
</div>
</body>
<script>
    function cal() {
        var a = parseInt(document.getElementById('f').value);
        var b = parseInt(document.getElementById('s').value);

        document.getElementById('e').innerHTML="Two value is equal: "+(a==b);
        document.getElementById('g').innerHTML="Two value and its type is equal: "+(a===b);
        document.getElementById('h').innerHTML="Two value is not equal: "+(a!=b);
    }
</script>

</html>
