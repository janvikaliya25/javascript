<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main" class="container d-flex flex-column align-items-center justify-content-center py-5">
        <div id="form" class="w-100 p-4 shadow rounded mb-4">
            <h5 class="mb-3">Weather App</h5>
            <form id="weatherForm" class="d-flex">
                <input type="text" id="cityInput" placeholder="Enter the city name" class="form-control me-2">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
        <div id="box" class="w-100">
           
        </div>
    </div>

  
  
    <script src="script.js"></script>

</html>
