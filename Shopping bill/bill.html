<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Shopping Bill</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-5xl mx-auto bg-gradient-to-r from-purple-100 via-pink-100 to-yellow-100 p-6 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-center mb-4 text-purple-800">🛒 Shopping Bill</h2>

    
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <input type="text" id="itemName" placeholder="Item Name" class="p-2 border rounded-md w-full" />
      <input type="number" id="itemPrice" placeholder="Price (₹)" class="p-2 border rounded-md w-full" />
      <input type="number" id="itemQty" placeholder="Quantity" class="p-2 border rounded-md w-full" />
    </div>

    <div class="text-center mt-4">
      <button onclick="addItem()" class="bg-gradient-to-r from-purple-500 via-pink-500 to-yellow-400 text-white px-6 py-2 rounded-md hover:opacity-90 transition">
        Add to Bill
      </button>
    </div>

  
    <div class="overflow-x-auto mt-6">
      <table class="min-w-full bg-white border border-gray-200 text-sm">
        <thead class="bg-gray-100 text-gray-700">
          <tr>
            <th class="px-4 py-2 border">Item</th>
            <th class="px-4 py-2 border">Price (₹)</th>
            <th class="px-4 py-2 border">Quantity</th>
            <th class="px-4 py-2 border">Total (₹)</th>
          </tr>
        </thead>
        <tbody id="billBody"></tbody>
      </table>
    </div>

   
    <div class="mt-6 bg-gray-50 p-4 rounded-md shadow-sm text-gray-800">
      <div id="subtotalDiv" class="mb-1">Subtotal: ₹0.00</div>
      <div id="discountDiv" class="mb-1">Discount (10%): ₹0.00</div>
      <div id="gstDiv" class="mb-1">GST (5%): ₹0.00</div>
      <div id="finalTotal" class="font-bold text-lg mt-2">Final Total: ₹0.00</div>
    </div>
  </div>


  <script src="script.js"></script>

</body>
</html>
