<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        .game-container {
            text-align: center;
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .word {
            font-size: 2rem;
            margin: 20px 0;
        }
        input {
            font-size: 1.5rem;
            padding: 5px;
            text-align: center;
        }
        .stats {
            margin-top: 20px;
            font-size: 1.2rem;
        }
        button {
            margin-top: 10px;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <h1>Typing speed game</h1>
        <div id="word">Start</div>
        <input type="text" id="input" placeholder="type here" disabled>
        <div>Time: <span id="time">0</span>s | Score: <span id="score">0</span></div>
        <button id="start">Start Game</button>
        <button id="restart">Restart</button>
    </div>
</body>
<script src="script.js"></script>
</html>
