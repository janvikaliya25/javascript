<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <style>
      #mr{
        margin-top: 50px;
        margin-left: 15%;
        background-color: #4D869C;
        position: relative;
      }
      #gr{
        position: absolute;
        right: 50px;
        top: 100px;
      }
      #st{
        position: absolute;
        right: 50px;
        top: 120px;
      }
    </style>
</head>
<body>
    <div class="col-8 border p-5" id="mr">
      <h3 class="text-center text-light">Marksheet</h3>
      <h6 class="text-light">Name:kaliya janvi bharatbhai</h6>
      <h6 id="gr" class="text-light">GRID:6027</h6>
      <h6 class="text-light">Seat No:4</h6>
      <h6 id="st" class="text-light">S.T.D:12th</h6>
        <table class="table mt-3  table-striped table-hover">
            <thead>
              <tr>
                <th scope="col">Subjects</th>
                <th scope="col">First exam mark</th>
                <th scope="col">Second exam mark</th>
                <th scope="col">Final exam mark</th>
                <th scope="col">Total marks</th>
                <th scope="col">Obtaind marks</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Account</th>
                <td id="ac1"></td>
                <td id="ac2"></td>
                <td id="ac3"></td>
                <td>100</td>
                <td id="ac4"></td>
              </tr>
              <tr>
                <th scope="row">Stat</th>
                <td id="s1"></td>
                <td id="s2"></td>
                <td id="s3"></td>
                <td>100</td>
                <td id="s4"></td>
              </tr>
              <tr>
                <th scope="row">Economics</th>
                <td id="e1"></td>
                <td id="e2"></td>
                <td id="e3"></td>
                <td>100</td>
                <td id="e4"></td>
              </tr>
              <tr>
                <th scope="row">B.A.</th>
                <td id="b1"></td>
                <td id="b2"></td>
                <td id="b3"></td>
                <td>100</td>
                <td id="b4"></td>
              </tr>
              <tr>
                <th scope="row">S.P.</th>
                <td id="sp1"></td>
                <td id="sp2"></td>
                <td id="sp3"></td>
                <td>100</td>
                <td id="sp4"></td>
              </tr>
              <tr>
                <th scope="row">English</th>
                <td id="en1"></td>
                <td id="en2"></td>
                <td id="en3"></td>
                <td>100</td>
                <td id="en4"></td>
              </tr>
              <tr>
                <th scope="row">Gujarati</th>
                <td id="g1"></td>
                <td id="g2"></td>
                <td id="g3"></td>
                <td>100</td>
                <td id="g4"></td>
              </tr>
              <tr>
                <td colspan="4" align="right">Total marks=</td>
                <td>700</td>
                <td id="ttl"></td>
              </tr>
              <tr>
                <td colspan="4" align="right">Persentage=</td>
                <td colspan="2" id="pr"></td>
              </tr>
            </tbody>
          </table>
    </div>
</body>
<script>
  var a=parseInt(prompt("enter the marks in account in first exam:"));
  var b=parseInt(prompt("enter the marks in account in second exam:"));
  var c=parseInt(prompt("enter the marks in account in final exam:"));
  document.getElementById('ac1').innerHTML=a;
  document.getElementById('ac2').innerHTML=b;
  document.getElementById('ac3').innerHTML=c;

  var d=a+b+c;
  document.getElementById('ac4').innerHTML=d;


  var e=parseInt(prompt("enter the marks in state in first exam:"));
  var f=parseInt(prompt("enter the marks in state in second exam:"));
  var g=parseInt(prompt("enter the marks in state in final exam:"));
  document.getElementById('s1').innerHTML=e;
  document.getElementById('s2').innerHTML=f;
  document.getElementById('s3').innerHTML=g;

  var h=e+f+g;
  document.getElementById('s4').innerHTML=h;


  var i=parseInt(prompt("enter the marks in economics in first exam:"));
  var j=parseInt(prompt("enter the marks in economics in second exam:"));
  var k=parseInt(prompt("enter the marks in economics in final exam:"));
  document.getElementById('e1').innerHTML=i;
  document.getElementById('e2').innerHTML=j;
  document.getElementById('e3').innerHTML=k;

  var l=i+j+k;
  document.getElementById('e4').innerHTML=l;


  var m=parseInt(prompt("enter the marks in B.A. in first exam:"));
  var n=parseInt(prompt("enter the marks in B.A. in second exam:"));
  var o=parseInt(prompt("enter the marks in B.A. in final exam:"));
  document.getElementById('b1').innerHTML=m;
  document.getElementById('b2').innerHTML=n;
  document.getElementById('b3').innerHTML=o;

  var p=m+n+o;
  document.getElementById('b4').innerHTML=p;


  var q=parseInt(prompt("enter the marks in S.P. in first exam:"));
  var r=parseInt(prompt("enter the marks in S.P. in second exam:"));
  var s=parseInt(prompt("enter the marks in S.P. in final exam:"));
  document.getElementById('sp1').innerHTML=q;
  document.getElementById('sp2').innerHTML=r;
  document.getElementById('sp3').innerHTML=s;

  var t=q+r+s;
  document.getElementById('sp4').innerHTML=t;


  var u=parseInt(prompt("enter the marks in english in first exam:"));
  var v=parseInt(prompt("enter the marks in english in second exam:"));
  var w=parseInt(prompt("enter the marks in english in final exam:"));
  document.getElementById('en1').innerHTML=u;
  document.getElementById('en2').innerHTML=v;
  document.getElementById('en3').innerHTML=w;

  var x=u+v+w;
  document.getElementById('en4').innerHTML=x;


  var y=parseInt(prompt("enter the marks in gujarati in first exam:"));
  var z=parseInt(prompt("enter the marks in gujarati in second exam:"));
  var z1=parseInt(prompt("enter the marks in gujarati in final exam:"));
  document.getElementById('g1').innerHTML=y;
  document.getElementById('g2').innerHTML=z;
  document.getElementById('g3').innerHTML=z1;

  var z2=y+z+z1;
  document.getElementById('g4').innerHTML=z2;

  var total=d+h+l+p+t+x+z2;
  document.getElementById('ttl').innerHTML=total;

  var pt=total/7;
  document.getElementById('pr').innerHTML=pt;
</script>
</html>
