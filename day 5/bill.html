<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <style>
       #bill{
        height: 500px;
        margin-left: 25%;
        margin-top: 100px;
        background-color: #FFD0D0;
       }
    </style>
</head>
<body>
    <div class="col-6 border p-3" id="bill">
        <h2 class="text-center" style="font-family: Lucida Calligraphy;">The night shop</h2>
        <p class="text-center">Shop 3,Second Floar,<br>Gandhi vadiya mall,Botad</p>
        <p><span>Invoice No:</span> <input type="tel" name="" id="" style="border: none;"> <span style="margin-left: 190px;">Date:</span> <input type="date" style="border: none;"></p>
        <p><span>Name:</span> <input type="text" style="border: none;"> <span style="margin-left: 225px;">Phone:</span> <input type="tel" style="border: none;"></p>
        <p><span>Address:</span> <input type="text" style="border: none;"></p>
    <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Description</th>
            <th scope="col">Qty.</th>
            <th scope="col">Rate</th>
            <th scope="col">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">1</th>
            <td>Shirt</td>
            <td id="q1"></td>
            <td id="r1"></td>
            <td id="a1"></td>
          </tr>
          <tr>
            <th scope="row">2</th>
            <td>Jeans</td>
            <td id="q2"></td>
            <td id="r2"></td>
            <td id="a2"></td>
          </tr>
          <tr>
            <th scope="row">3</th>
            <td>Kurti</td>
            <td id="q3"></td>
            <td id="r3"></td>
            <td id="a3"></td>
          </tr>
          <tr>
            <td colspan="3"></td>
            <td>Totle =</td>
            <td id="tl"></td>
          </tr>
        </tbody>
      </table>
    </div>
</body>
<script>
    var a=parseInt(prompt("Enter the quntity of shirt"));
    var b=parseInt(prompt("Enter the rate of shirt"));
    document.getElementById('q1').innerHTML=a;
    document.getElementById('r1').innerHTML=b;

    var c=a*b;
    document.getElementById('a1').innerHTML=c;

    var d=parseInt(prompt("Enter the quntity of jeans"));
    var e=parseInt(prompt("Enter the rate of jeans"));
    document.getElementById('q2').innerHTML=d;
    document.getElementById('r2').innerHTML=e;

    var f=d*e;
    document.getElementById('a2').innerHTML=f;

    var g=parseInt(prompt("Enter the quntity of kurti"));
    var h=parseInt(prompt("Enter the rate of kurti"));
    document.getElementById('q3').innerHTML=g;
    document.getElementById('r3').innerHTML=h;

    var i=g*h;
    document.getElementById('a3').innerHTML=i;

    var totle=c+f+i;
    document.getElementById('tl').innerHTML=totle;
</script>
</html>
