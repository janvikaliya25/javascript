<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="col-8 border p-5" style="margin-top: 200px;margin-left: 15%;background-color: #B3C8CF;">
        <h3 class="text-center">swap value</h3>
    <table class="table mt-3">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">First value</th>
            <th scope="col">Second value</th>
            <th scope="col">Third value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">1</th>
            <td id="f"></td>
            <td id="s"></td>
            <td id="t"></td>
          </tr>
          <tr>
            <th>swap value</th>
            <td id="fv"></td>
            <td id="sv"></td>
            <td id="tv"></td>
          </tr>
        </tbody>
      </table>
    </div>
</body>
<script>
    var a=prompt("enter the first value:");
    var b=prompt("enter the second value:");
    var c=prompt("enter the third value:");

    document.getElementById('f').innerHTML=a;
    document.getElementById('s').innerHTML=b;
    document.getElementById('t').innerHTML=c;

     var d;
     d=a;
     a=b;
     b=c;
     c=d;

     document.getElementById('fv').innerHTML=a;
     document.getElementById('sv').innerHTML=b;
     document.getElementById('tv').innerHTML=c;
</script>
</html>
