<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="col-6  m-auto mt-5 border" style="height: 500px;background-color: #FFCBCB;">
        <h3 class="text-center mt-5">Intrest</h3>
    <form action="" class="col-8 p-3 m-auto mt-4">
        <fieldset>
            <input type="number" placeholder="Enter the principal rate:" id="principal" class="form-control mt-3">
            <input type="number" placeholder="Enter the interest rate:" id="rate" class="form-control mt-3">
            <input type="number" placeholder="Enter the year" id="year" class="form-control mt-3">
            <button type="button" class="btn btn-secondary mt-3" onclick="int()" style="width: 200px;">Submit</button>
            <input type="text" id="intrest" class="form-control mt-3" placeholder="answer">
        </fieldset>
    </form>
    <!-- <div class="col-8 m-auto border"  style="height: 100px;"><h1 id="intrest" class="text-center mt-4"></h1></div> -->
</div>
</body>
<script>
function int(){
    var p=parseInt(document.getElementById("principal").value);
    var r=parseInt(document.getElementById("rate").value);
    var n=parseInt(document.getElementById("year").value);

    var i=p*r*n/100;
    document.getElementById("intrest").value="The totle intrest="+i;
}
</script>
</html>
